# Replay stack in the dev image (domain 72, localhost only, no control nodes).
#   REPO=$(git rev-parse --show-toplevel) ULTRON_UID=$(id -u) ULTRON_GID=$(id -g) BAG=/abs/path/to/bag \
#     docker compose -f ros2_ws/docker/compose.replay.yaml up
# The bag is mounted read-only at the same path; it is never copied into the repo.
services:
  replay:
    image: ultron-b2-dev:humble
    network_mode: host
    ipc: private
    user: "${ULTRON_UID:?}:${ULTRON_GID:?}"
    working_dir: ${REPO:?set REPO to the repo root}/ros2_ws
    volumes:
      - ${REPO}:${REPO}
      - ${BAG:?set BAG to the bag directory}:${BAG}:ro
    environment:
      ROS_DOMAIN_ID: "72"
      ROS_LOCALHOST_ONLY: "1"
      RMW_IMPLEMENTATION: rmw_cyclonedds_cpp
      CYCLONEDDS_URI: file://${REPO}/ros2_ws/src/ultron_b2_bringup/config/dds/cyclonedds_localhost.xml
      HOME: ${REPO}/ros2_ws/.dev_home
      ROS_LOG_DIR: ${REPO}/ros2_ws/log/ros
    command: >-
      bash -lc "source install/setup.bash &&
      scripts/ultron_launch.sh replay mode:=$${ULTRON_REPLAY_MODE:-mapping} bag:=${BAG}"
