# cloud_to_scan (ultron_b2_preprocess, RELIABLE in/out) for the SIMULATED lidar (sim choices): sensors/lidar/points_filtered -> sensors/scan.
# Height band: integrated ch.04 window -0.20..0.35 m in base_link, expressed in base_footprint
# (base_link is 0.65 m above base_footprint in calibration/sim.yaml) = 0.45..1.00 m.
# Floor at 0 in base_footprint. All values PROPOSED.
/**:
  ros__parameters:
    target_frame: base_footprint
    min_height: 0.45
    max_height: 1.00
    angle_min: -3.14159265
    angle_max: 3.14159265
    angle_increment: 0.00349066   # 0.2 deg, Helios azimuth step at 10 Hz
    scan_time: 0.1
    range_min: 0.35
    range_max: 12.0
