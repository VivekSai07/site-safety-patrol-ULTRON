# Perception parameters for sim (all thresholds PROPOSED; simulation values are not hardware settings).
/**:
  ros__parameters:
    # ladder_detector
    backend: oracle_sim            # ORACLE in sim; yolo/owlv2 need locally supplied weights (owner: Om)
    oracle_source: segmentation    # visible simulator instance labels; projection remains optional
    oracle_pose_topic: sim/ground_truth/base_pose   # F ultron_b2_sim (PoseStamped, frame ultron_sim_world); EVALUATION ONLY
    max_rate_hz: 5.0
    score_threshold: 0.25
    # ladder_localizer
    tf_timeout_s: 0.1
    depth_sync_tolerance_s: 0.05
    max_image_age_s: 1.0
    depth_scale_16u: 0.001
    max_range_m: 8.0
    # ladder_tracker
    association_radius_m: 0.65
    ambiguity_ratio: 0.5
    missing_after_views: 3
