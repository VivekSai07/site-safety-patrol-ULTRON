[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ultron-site-safety-patrol"
version = "0.4.0"
description = "ULTRON B2 MuJoCo ladder patrol, persistent evidence memory and Rerun/RViz replay"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
sim = ["mujoco>=3.3,<4", "numpy>=1.24", "Pillow>=9"]
# Camera frames to nesseler checklist records (vision model over HTTP, no GPU).
protocol = ["Pillow>=9", "numpy>=1.24"]
# Recorded B2 bags without ROS, lidar odometry for them, and the open-vocabulary detector (GPU).
bags = ["rosbags>=0.10", "kiss-icp>=1.2"]
# YOLOE's text prompts need OpenAI CLIP and its tracker needs lap; ultralytics would pip-install
# both at first use, which fails on a robot without internet. Install with pip >= 23 (Ubuntu 22.04's
# pip 22 reports success but installs nothing for the CLIP package).
detector = ["ultralytics>=8.3", "lap>=0.5.12",
            "clip @ git+https://github.com/ultralytics/CLIP.git@7ffa84b3bfa40c42ecc1c77147a855e69cb2dd40"]
# 2D SLAM simulation; ROS 2 Humble rclpy comes from the system (see scripts/setup-ros-venv.sh).
autonomy = ["mujoco>=3.3,<4", "numpy>=1.24", "Pillow>=9", "PyYAML>=5.4"]
rerun = ["rerun-sdk==0.32.0", "numpy>=1.24", "Pillow>=9"]
# Live dashboard: CPU only, no ROS or GPU; runs on Ubuntu and Windows.
dashboard = ["fastapi>=0.110,<1", "uvicorn>=0.29,<1", "pydantic>=2,<3", "httpx>=0.27,<1", "pypdf>=4,<7", "reportlab>=4,<5", "Pillow>=9"]

# Model extras are intentionally separate from the simulation and ROS interpreter.
# Check upstream licensing before distributing weights or commercial deployment.
perception-yolo = ["ultralytics>=8.3.0", "Pillow>=9"]
perception-vlm = ["transformers>=4.57,<5", "accelerate>=1", "Pillow>=9", "torch>=2.2"]

training-vlm = ["transformers>=4.57,<5", "accelerate>=1", "Pillow>=9", "torch>=2.2", "peft>=0.17,<1"]

[project.scripts]
ultron = "ultron.__main__:main"
ultron-protocol = "ultron.protocol.__main__:main"
ultron-pipeline = "ultron.pipeline.__main__:main"
safety-patrol = "site_safety_patrol.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ultron = [
    "assets/b2/*.xml",
    "assets/b2/LICENSE",
    "assets/b2/PROVENANCE.md",
    "assets/schemas/generic_ladder_draft_v1.json",
    "assets/inspection_v1/*.json",
    "assets/inspection_v1/*.txt",
    "assets/inspection_v2/*.json",
    "assets/inspection_v2/*.txt",
    "assets/site_safety_v1/*.json",
    "assets/site_safety_v1/*.txt",
    "dashboard/static/*",
]
