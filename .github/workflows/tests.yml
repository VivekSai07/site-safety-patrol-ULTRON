name: Python tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # sim: MuJoCo. dashboard: FastAPI. autonomy: PyYAML for the SLAM/navigation tests.
      # protocol: the real-robot pipeline. GPU and ROS extras are not needed by any test.
      - run: python -m pip install -e '.[sim,dashboard,autonomy,protocol]'
      - run: python -m unittest discover -s tests -v
